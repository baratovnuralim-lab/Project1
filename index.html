<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финансовый календарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #2b2f33;
    --muted: #8a9096;
    --line: #e1e3e6;
    --income: #1aa36f;
    --expense: #e0473e;
    --pos: #9aebe3;
    --neg: #ff9a94;
    --gap-bg: #ffe0e2;
    --gap-border: #e0473e;
    --other-month: #f7f7f8;
    --accent: #2b2f33;
    --c-food: #e8913a; --c-drinks: #3aa0d8; --c-alcohol: #9b4dca; --c-transport: #4a7bd8;
    --c-home: #a07a52; --c-phone: #2bb3a3; --c-health: #e05a7a; --c-clothes: #d1a12e;
    --c-fun: #e86a4a; --c-credit: #6b7785; --c-other: #9aa1a8;
    --c-kaspi: #f14635; --c-halyk: #1f9a55; --c-none: #9aa1a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 "PT Sans", system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 1340px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ---------- Header ---------- */
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    justify-content: space-between; margin-bottom: 16px;
  }
  .title { display: flex; align-items: center; gap: 12px; }
  .title h1 { font-size: 24px; margin: 0; font-weight: 700; min-width: 190px; }
  .nav-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; font-size: 18px; color: var(--text);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { border-color: #c4c8cc; }
  .today-btn {
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; font: inherit; color: var(--text);
  }
  .settings { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); max-width: 420px; }
  .sync::before { flex: none; }
  .sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .sync[data-state="saved"]::before { background: var(--income); }
  .sync[data-state="saving"]::before, .sync[data-state="loading"]::before { background: var(--c-food); }
  .sync[data-state="local"]::before, .sync[data-state="offline"]::before { background: var(--c-clothes); }
  .sync[data-state="error"] { color: var(--expense); }
  .sync[data-state="error"]::before { background: var(--expense); }
  .settings label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .settings input {
    width: 130px; height: 34px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 8px; font: inherit; color: var(--text); background: var(--card);
  }

  /* ---------- Summary ---------- */
  .summary {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px;
  }
  .stat { background: var(--card); border-radius: 10px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .stat .v { font-size: 18px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .v.income { color: var(--income); }
  .v.expense { color: var(--expense); }
  .v.alcohol { color: var(--c-alcohol); }
  .stat .note { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat.alc { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-alcohol) 45%, transparent); }

  /* ---------- Calendar ---------- */
  .calendar {
    background: var(--card); border-radius: 6px; padding: 8px 16px 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.06);
  }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 10px; }
  .dow {
    font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    padding: 14px 0 18px; border-bottom: 1px solid var(--line); letter-spacing: .02em;
  }
  .day {
    position: relative; border-top: 1px solid var(--line); margin-top: -1px;
    height: 134px; display: flex; flex-direction: column; cursor: pointer;
    font-variant-numeric: tabular-nums; outline: none;
  }
  .day:first-of-type { border-top: 0; }
  .day .head { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 10px 0; min-height: 34px; }
  .day .num { margin-left: auto; font-size: 15px; }
  .day .lines { margin-top: auto; }
  .day .line { padding: 0 10px; height: 30px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .in { color: var(--income); }
  .day .out { color: var(--expense); }
  .day .net { color: var(--text); }
  .day .net.pos { background: var(--pos); }
  .day .net.neg { background: var(--neg); }
  .day:hover .num, .day:focus-visible .num { font-weight: 700; }
  .day:focus-visible { box-shadow: inset 0 0 0 2px #7fb3ff; }

  .day.future .in, .day.future .out, .day.future .net { opacity: .6; }
  .day.future .net.pos { background: rgba(154, 235, 227, .5); opacity: 1; color: rgba(43,47,51,.6); }
  .day.future .net.neg { background: rgba(255, 154, 148, .3); opacity: 1; color: rgba(43,47,51,.6); }

  .day.today .num {
    background: var(--accent); color: #fff; border-radius: 12px; padding: 0 8px; font-weight: 700;
  }

  .day.other { background: var(--other-month); cursor: default; }
  .day.other .num { color: #c4c8cc; }

  .day.gap {
    background: var(--gap-bg); border: 1px dashed var(--gap-border); border-radius: 4px;
    margin: -1px -6px 0; z-index: 2;
    box-shadow: 0 6px 24px rgba(224, 71, 62, .28);
  }
  .day.gap .head { padding: 10px 14px 0; }
  .day.gap .line { padding: 0 14px; }
  .day.gap .gap-title { font-weight: 700; font-size: 14px; }
  .day.gap .in, .day.gap .out { opacity: .75; }
  .day.gap .in.zero { color: var(--muted); }
  .day.gap .net.neg { background: var(--neg); color: rgba(43,47,51,.7); border-radius: 0 0 3px 3px; }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; color: var(--muted); font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

  /* ---------- Modal ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(20, 24, 28, .35); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 20;
  }
  .backdrop.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 12px; width: 100%; max-width: 480px;
    max-height: calc(100vh - 32px); overflow: auto; padding: 20px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal h2 { margin: 0 0 4px; font-size: 20px; }
  .modal .sub { color: var(--muted); margin-bottom: 14px; }
  .ops { list-style: none; margin: 0 0 16px; padding: 0; }
  .ops li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ops .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ops .amt { font-variant-numeric: tabular-nums; font-weight: 700; }
  .ops .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; }
  .ops .del:hover { color: var(--expense); }
  .ops .empty { color: var(--muted); justify-content: center; }
  .balance-row { display: flex; justify-content: space-between; padding: 6px 0; color: var(--muted); }
  .balance-row b { color: var(--text); font-variant-numeric: tabular-nums; }
  .balance-row b.neg { color: var(--expense); }
  form.add { display: grid; grid-template-columns: 1fr 120px; gap: 8px; margin-top: 14px; }
  form.add input, form.add select {
    height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; color: var(--text); background: #fff;
  }
  form.add .type { grid-column: 1 / -1; display: flex; gap: 8px; }
  form.add .type label {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  form.add .type input { display: none; }
  form.add .type input[value="in"]:checked + span { color: var(--income); font-weight: 700; }
  form.add .type input[value="out"]:checked + span { color: var(--expense); font-weight: 700; }
  form.add .type label:has(input:checked) { border-color: currentColor; background: #fafafa; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; grid-column: 1 / -1; }
  .btn {
    height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font: inherit; color: var(--text);
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.right { margin-left: auto; }

  .day .head { gap: 6px; }
  .alc-mark {
    font-size: 11px; font-weight: 700; line-height: 18px; padding: 0 7px; border-radius: 9px;
    color: var(--c-alcohol); background: color-mix(in srgb, var(--c-alcohol) 14%, transparent);
    white-space: nowrap;
  }

  /* ---------- Chips & tags ---------- */
  .picker { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .picker[hidden] { display: none; }
  .picker-label { grid-column: 1 / -1; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 15px; background: var(--card); color: var(--text);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip::before, .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tag); flex: none; }
  .chip:hover { border-color: var(--tag); }
  .chip:focus-visible { outline: 2px solid var(--tag); outline-offset: 1px; }
  .chip[aria-checked="true"] { border-color: var(--tag); background: color-mix(in srgb, var(--tag) 16%, transparent); font-weight: 700; }
  .chip.bank { height: 36px; padding: 0 18px; font-size: 14px; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 12px; padding: 1px 8px; border-radius: 10px;
    background: color-mix(in srgb, var(--tag) 14%, transparent); color: var(--text);
  }

  /* ---------- Breakdown ---------- */
  .breakdown { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; margin-top: 16px; align-items: start; }
  .panel { background: var(--card); border-radius: 10px; padding: 16px 16px 10px; box-shadow: 0 1px 3px var(--shadow); min-width: 0; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  .bar-row {
    display: grid; grid-template-columns: 150px minmax(0, 1fr) 150px; align-items: center; gap: 12px;
    padding: 6px 8px; border-radius: 6px; font-variant-numeric: tabular-nums;
  }
  .bar-row.alc { background: color-mix(in srgb, var(--c-alcohol) 10%, transparent); font-weight: 700; }
  .bar-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tag); flex: none; }
  .bar-track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--tag); border-radius: 4px; }
  .bar-val { text-align: right; white-space: nowrap; }
  .bar-val small { color: var(--muted); font-weight: 400; }
  .empty-note { color: var(--muted); font-size: 13px; padding: 4px 8px 8px; }

  @media (max-width: 1000px) {
    .breakdown { grid-template-columns: minmax(0, 1fr); }
    .alc-mark { font-size: 0; width: 8px; height: 8px; padding: 0; margin-top: 5px; background: var(--c-alcohol); }
    .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .day { height: 120px; font-size: 12px; }
    .day .line { padding: 0 6px; height: 26px; }
    .day .head { padding: 8px 6px 0; }
    .day.gap { margin: -1px 0 0; }
    .grid { column-gap: 4px; }
  }
  @media (max-width: 720px) {
    .bar-row { grid-template-columns: 100px minmax(0, 1fr) auto; gap: 8px; }
    .bar-val small { display: none; }
    .calendar { padding: 4px 6px 10px; }
    .dow { font-size: 10px; text-align: center; padding: 10px 0; }
    .dow .full { display: none; }
    .day { height: 92px; font-size: 10px; }
    .day .line { height: 18px; padding: 0 3px; }
    .day .in, .day .out { display: none; }
    .day.gap .gap-title { display: none; }
    .day.gap .line { padding: 0 3px; }
    .day.gap .head { padding: 6px 4px 0; }
    .grid { column-gap: 2px; }
  }
  @media (min-width: 721px) { .dow .short, .shortv { display: none; } }
  @media (max-width: 720px) { .fullv { display: none; } .day .net { justify-content: center; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">
      <button class="nav-btn" id="prev" aria-label="Предыдущий месяц">‹</button>
      <h1 id="monthTitle"></h1>
      <button class="nav-btn" id="next" aria-label="Следующий месяц">›</button>
      <button class="today-btn" id="todayBtn">Сегодня</button>
    </div>
    <div class="settings">
      <label>Остаток на начало месяца <input id="opening" type="number" step="1000"></label>
      <span class="sync" id="sync" data-state="local" role="status" aria-live="polite"></span>
    </div>
  </div>

  <div class="summary">
    <div class="stat"><div class="k">Доходы</div><div class="v income" id="sIn"></div></div>
    <div class="stat"><div class="k">Расходы</div><div class="v expense" id="sOut"></div></div>
    <div class="stat"><div class="k">Итог месяца</div><div class="v" id="sNet"></div></div>
    <div class="stat"><div class="k">Остаток на конец</div><div class="v" id="sEnd"></div></div>
    <div class="stat"><div class="k">Кассовые разрывы</div><div class="v" id="sGap"></div></div>
    <div class="stat alc"><div class="k">Алкоголь</div><div class="v alcohol" id="sAlc"></div><div class="note" id="sAlcNote"></div></div>
  </div>

  <div class="calendar">
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--pos)"></i>Положительный итог дня</span>
      <span><i class="sw" style="background:var(--neg)"></i>Отрицательный итог дня</span>
      <span><i class="sw" style="background:rgba(154,235,227,.5)"></i>Плановые операции</span>
      <span><i class="sw" style="background:var(--gap-bg);border:1px dashed var(--gap-border)"></i>Кассовый разрыв</span>
      <span><i class="alc-mark">алкоголь</i>Были траты на алкоголь</span>
    </div>
  </div>

  <div class="breakdown">
    <section class="panel"><h2>Расходы по категориям</h2><div id="byCat"></div></section>
    <section class="panel"><h2>Доходы по банкам</h2><div id="byBank"></div></section>
  </div>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div class="sub" id="mSub"></div>
    <ul class="ops" id="mOps"></ul>
    <div class="balance-row"><span>Остаток на начало дня</span><b id="mStart"></b></div>
    <div class="balance-row"><span>Остаток на конец дня</span><b id="mEnd"></b></div>
    <form class="add" id="addForm">
      <div class="type">
        <label><input type="radio" name="type" value="out" checked><span>Расход</span></label>
        <label><input type="radio" name="type" value="in"><span>Доход</span></label>
      </div>
      <div class="picker-label" id="pickLabel">На что потрачено</div>
      <div class="picker" id="pickCat" role="radiogroup" aria-label="Категория расхода"></div>
      <div class="picker" id="pickBank" role="radiogroup" aria-label="Банк" hidden></div>
      <input name="title" id="fTitle" placeholder="Комментарий (необязательно)">
      <input name="amount" id="fAmount" type="number" min="0.01" step="0.01" placeholder="Сумма, ₸" required>
      <div class="modal-actions">
        <button type="button" class="btn" id="resetDay">Очистить день</button>
        <button type="button" class="btn right" id="closeModal">Закрыть</button>
        <button type="submit" class="btn primary">Добавить</button>
      </div>
    </form>
  </div>
</div>

<script>
(() => {
  const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const DOW = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
  const DOW_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const CATS = [
    { id: 'food', name: 'Еда' }, { id: 'drinks', name: 'Напитки' }, { id: 'alcohol', name: 'Алкоголь' },
    { id: 'transport', name: 'Транспорт' }, { id: 'home', name: 'Жильё и коммуналка' }, { id: 'phone', name: 'Связь и интернет' },
    { id: 'health', name: 'Здоровье' }, { id: 'clothes', name: 'Одежда' }, { id: 'fun', name: 'Развлечения' },
    { id: 'credit', name: 'Кредиты' }, { id: 'other', name: 'Другое' },
  ];
  const BANKS = [{ id: 'kaspi', name: 'Kaspi' }, { id: 'halyk', name: 'Halyk' }];
  const NO_BANK = { id: 'none', name: 'Без банка' };
  const catOf = o => CATS.find(c => c.id === o.cat) || CATS[CATS.length - 1];
  const bankOf = o => BANKS.find(b => b.id === o.bank) || NO_BANK;
  const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
  const STORE_KEY = 'fincal:v2';

  const fmt = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money = (v, sign = true) => {
    const s = fmt.format(Math.abs(v));
    const p = !sign ? (v < 0 ? '−' : '') : (v < 0 ? '−' : '+');
    return `${p}${s} ₸`;
  };
  const short = v => {
    const a = Math.abs(v);
    if (a >= 1e6) return `${Math.round(a / 1e5) / 10}`.replace('.', ',') + 'М';
    if (a >= 1e3) return `${Math.round(a / 1e3)}К`;
    return `${Math.round(a)}`;
  };
  const key = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

  // ---------- Storage (per-viewer convenience) ----------
  let store = { days: {}, opening: {} };
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
  const hadLocal = Object.keys(store.days).some(k => (store.days[k] || []).length) || Object.keys(store.opening).length > 0;

  // ---------- Cloud storage (artifact db, private per person) ----------
  let backend = 'local', db = null, uid = null;
  const SYNC_TEXT = {
    local: 'Сохраняется только в этом браузере',
    loading: 'Загрузка данных…',
    saving: 'Сохранение…',
    saved: 'Сохранено в облаке',
    offline: 'Нет связи с хранилищем, изменения пока не сохранены',
    error: 'Не удалось сохранить, попробуйте ещё раз',
    imported: 'Записи из браузера перенесены в облако',
    noaccess: 'Нет прав на сохранение в облаке, записи хранятся только в этом браузере. Попросите владельца выдать доступ на редактирование',
  };
  function setStatus(s) {
    const el = document.getElementById('sync');
    el.dataset.state = s === 'imported' ? 'saved' : s === 'noaccess' ? 'error' : s;
    el.textContent = SYNC_TEXT[s];
  }
  function monthBody(mk) {
    const days = {};
    Object.keys(store.days).forEach(k => {
      if (k.startsWith(mk + '-') && store.days[k] && store.days[k].length) days[k.slice(8)] = store.days[k];
    });
    const body = { days };
    if (mk in store.opening) body.opening = store.opening[mk];
    return body;
  }
  const queues = {};
  let pending = 0;
  function save(mk) {
    if (backend !== 'cloud') {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
      return Promise.resolve();
    }
    const ref = db.collection('data/users/' + uid).doc('m-' + mk);
    pending++; setStatus('saving');
    const run = () => {
      const body = monthBody(mk);
      const empty = !Object.keys(body.days).length && !('opening' in body);
      const write = () => empty ? ref.delete() : ref.set(JSON.parse(JSON.stringify(body)));
      return write().catch(e => {
        if (e && e.code === 'unavailable') return new Promise(res => setTimeout(res, 800 + Math.random() * 800)).then(write);
        throw e;
      });
    };
    queues[mk] = (queues[mk] || Promise.resolve()).then(run).then(
      () => { if (--pending === 0) setStatus('saved'); },
      e => {
        pending--;
        if (e && e.code === 'invalid_argument' && backend === 'cloud') {
          // у этого человека нет права записи: работаем локально и честно об этом говорим
          backend = 'local';
          try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (x) {}
          setStatus('noaccess');
        } else setStatus('error');
      });
    return queues[mk];
  }
  function applySnapshot(snap) {
    const days = {}, opening = {};
    snap.docs.forEach(d => {
      if (!d.id.startsWith('m-')) return;
      const mk = d.id.slice(2), b = d.data() || {};
      Object.entries(b.days || {}).forEach(([dd, ops]) => {
        if (Array.isArray(ops)) days[mk + '-' + dd] = ops.map(o => ({ ...o }));
      });
      if (typeof b.opening === 'number') opening[mk] = b.opening;
    });
    store = { days, opening };
    render();
    if (openDay) renderModal();
  }
  async function connectCloud() {
    if (!window.claude || typeof window.claude.use !== 'function') { setStatus('local'); return; }
    setStatus('loading');
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = u ? await u.id() : null;
    if (!d || !id) { setStatus('local'); return; }
    db = d; uid = id;
    const timer = setTimeout(() => { if (backend !== 'cloud') setStatus('offline'); }, 10000);
    db.collection('data/users/' + uid).onSnapshot(snap => {
      if (backend !== 'cloud') {
        if (snap.metadata.fromCache) return; // ждём подтверждённых данных
        clearTimeout(timer);
        backend = 'cloud';
        if (snap.empty && hadLocal) {
          // первый вход: переносим то, что уже было записано в этом браузере
          const months = new Set(Object.keys(store.days).map(k => k.slice(0, 7)).concat(Object.keys(store.opening)));
          Promise.all([...months].map(save)).then(() => setStatus('imported'));
          return;
        }
        setStatus('saved');
      }
      applySnapshot(snap);
    }, () => { clearTimeout(timer); if (backend !== 'cloud') setStatus('local'); else setStatus('error'); });
  }

  const opsFor = (y, m, d) => {
    const k = key(y, m, d);
    return store.days[k] || [];
  };
  const openingFor = (y, m) => {
    const k = key(y, m, 1).slice(0, 7);
    if (k in store.opening) return store.opening[k];
    // иначе переносим остаток с конца предыдущего месяца
    const keys = Object.keys(store.days).concat(Object.keys(store.opening)).map(x => x.slice(0, 7)).sort();
    if (!keys.length || k <= keys[0]) return 0;
    const prev = new Date(y, m - 1, 1);
    return compute(prev.getFullYear(), prev.getMonth()).end;
  };

  // ---------- State ----------
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let view = { y: today.getFullYear(), m: today.getMonth() };
  let current = null; // computed month data

  function compute(y, m) {
    const days = new Date(y, m + 1, 0).getDate();
    let bal = openingFor(y, m);
    const list = [];
    let tin = 0, tout = 0, minBal = Infinity;
    const byCat = {}, byBank = {};
    for (let d = 1; d <= days; d++) {
      const ops = opsFor(y, m, d);
      const inc = ops.filter(o => o.type === 'in').reduce((s, o) => s + o.amount, 0);
      const out = ops.filter(o => o.type === 'out').reduce((s, o) => s + o.amount, 0);
      const start = bal;
      bal = Math.round((bal + inc - out) * 100) / 100;
      tin += inc; tout += out;
      let alc = 0;
      ops.forEach(o => {
        if (o.type === 'out') { const c = catOf(o).id; byCat[c] = (byCat[c] || 0) + o.amount; if (c === 'alcohol') alc += o.amount; }
        else { const b = bankOf(o).id; byBank[b] = (byBank[b] || 0) + o.amount; }
      });
      minBal = Math.min(minBal, bal);
      list.push({ d, ops, inc, out, alc, net: inc - out, start, end: bal, gap: bal < 0 && inc - out < 0 && start >= 0 });
    }
    // если разрыв продолжается и углубляется — подсвечиваем дни, где он растёт
    list.forEach((x, i) => { if (!x.gap && x.end < 0 && x.end < (list[i - 1]?.end ?? 0) && (list[i - 1]?.end ?? 0) >= 0) x.gap = true; });
    return { y, m, days, list, tin, tout, end: bal, minBal, byCat, byBank };
  }

  // ---------- Render ----------
  const grid = document.getElementById('grid');

  function render() {
    const { y, m } = view;
    current = compute(y, m);
    document.getElementById('monthTitle').textContent = `${MONTHS[m]} ${y}`;
    document.getElementById('opening').value = openingFor(y, m);

    const sNet = document.getElementById('sNet');
    document.getElementById('sIn').textContent = money(current.tin);
    document.getElementById('sOut').textContent = money(-current.tout);
    sNet.textContent = money(current.tin - current.tout);
    sNet.className = 'v ' + (current.tin - current.tout >= 0 ? 'income' : 'expense');
    const sEnd = document.getElementById('sEnd');
    sEnd.textContent = money(current.end, false);
    sEnd.className = 'v ' + (current.end < 0 ? 'expense' : '');
    const gaps = current.list.filter(x => x.gap);
    const sGap = document.getElementById('sGap');
    sGap.textContent = gaps.length ? `${gaps.length} · до ${short(-current.minBal)} ₸` : 'Нет';
    sGap.className = 'v ' + (gaps.length ? 'expense' : 'income');
    const alc = current.byCat.alcohol || 0;
    document.getElementById('sAlc').textContent = money(-alc);
    document.getElementById('sAlcNote').textContent = current.tout ? `${Math.round(alc / current.tout * 100)}% от расходов · ${current.list.filter(x => x.alc).length} дн.` : 'Расходов пока нет';

    const html = [];
    DOW.forEach((n, i) => html.push(`<div class="dow"><span class="full">${n}</span><span class="short">${DOW_SHORT[i]}</span></div>`));

    const first = new Date(y, m, 1);
    const lead = (first.getDay() + 6) % 7;
    const prevDays = new Date(y, m, 0).getDate();
    for (let i = lead - 1; i >= 0; i--) html.push(`<div class="day other"><div class="head"><span class="num">${prevDays - i}</span></div></div>`);

    current.list.forEach(x => {
      const date = new Date(y, m, x.d);
      const cls = ['day'];
      if (date > today) cls.push('future');
      if (+date === +today) cls.push('today');
      if (x.gap) cls.push('gap');
      const lines = [];
      if (x.gap) {
        lines.push(`<div class="line in ${x.inc ? '' : 'zero'}">${money(x.inc)}</div>`);
        lines.push(`<div class="line out">${money(-x.out)}</div>`);
      } else {
        if (x.inc) lines.push(`<div class="line in">${money(x.inc)}</div>`);
        if (x.out) lines.push(`<div class="line out">${money(-x.out)}</div>`);
      }
      if (x.ops.length) lines.push(`<div class="line net ${x.net >= 0 ? 'pos' : 'neg'}"><span class="fullv">${money(x.net)}</span><span class="shortv">${x.net < 0 ? '−' : '+'}${short(x.net)}</span></div>`);
      const gapTitle = x.gap ? `<span class="gap-title">Разрыв в ${short(-x.end)} ₸</span>` : '';
      const label = `${x.d} ${MONTHS_GEN[m]}: итог ${money(x.net)}, остаток ${money(x.end, false)}`;
      html.push(`<div class="${cls.join(' ')}" data-d="${x.d}" tabindex="0" role="button" aria-label="${label}" title="Остаток на конец дня: ${money(x.end, false)}">
        <div class="head">${gapTitle}${x.alc ? `<span class="alc-mark" title="Алкоголь: ${money(-x.alc)}">алкоголь</span>` : ''}<span class="num">${x.d}</span></div>
        <div class="lines">${lines.join('')}</div>
      </div>`);
    });

    const total = lead + current.days;
    const trail = (7 - total % 7) % 7;
    for (let i = 1; i <= trail; i++) html.push(`<div class="day other"><div class="head"><span class="num">${i}</span></div></div>`);
    grid.innerHTML = html.join('');
    renderBreakdown();
  }

  function barRow(item, value, max, total, extra = '') {
    const pct = total ? Math.round(value / total * 100) : 0;
    const w = max ? Math.max(value / max * 100, value ? 2 : 0) : 0;
    return `<div class="bar-row ${extra}" style="--tag:var(--c-${item.id})">
      <span class="bar-name">${item.name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div>
      <span class="bar-val">${money(value, false)} <small>· ${pct}%</small></span></div>`;
  }
  function renderBreakdown() {
    const { byCat, byBank, tout, tin } = current;
    const cats = CATS.filter(c => byCat[c.id] || c.id === 'alcohol').sort((a, b) => (byCat[b.id] || 0) - (byCat[a.id] || 0));
    const maxC = Math.max(0, ...cats.map(c => byCat[c.id] || 0));
    document.getElementById('byCat').innerHTML =
      (tout ? '' : '<div class="empty-note">Расходов в этом месяце пока нет. Нажмите на день, чтобы добавить расход.</div>') +
      cats.map(c => barRow(c, byCat[c.id] || 0, maxC, tout, c.id === 'alcohol' ? 'alc' : '')).join('');
    const banks = BANKS.concat(byBank.none ? [NO_BANK] : []);
    const maxB = Math.max(0, ...banks.map(b => byBank[b.id] || 0));
    document.getElementById('byBank').innerHTML =
      (tin ? '' : '<div class="empty-note">Доходов в этом месяце пока нет.</div>') +
      banks.map(b => barRow(b, byBank[b.id] || 0, maxB, tin)).join('');
  }

  // ---------- Modal ----------
  const backdrop = document.getElementById('backdrop');
  let openDay = null;

  function openModal(d) {
    openDay = d;
    renderModal();
    backdrop.classList.add('open');
    renderPickers();
    setTimeout(() => document.getElementById('fAmount').focus(), 0);
  }
  function renderModal() {
    const x = current.list[openDay - 1];
    const { y, m } = view;
    const date = new Date(y, m, openDay);
    document.getElementById('mTitle').textContent = `${openDay} ${MONTHS_GEN[m]} ${y}`;
    const plan = date > today ? 'Плановые операции' : 'Фактические операции';
    document.getElementById('mSub').textContent = x.gap ? `${plan} · кассовый разрыв ${money(x.end, false)}` : plan;
    const ul = document.getElementById('mOps');
    ul.innerHTML = x.ops.length ? x.ops.map((o, i) => `
      <li>${(t => `<span class="tag" style="--tag:var(--c-${t.id})">${t.name}</span>`)(o.type === 'in' ? bankOf(o) : catOf(o))}<span class="name">${esc(o.title || '')}</span>
        <span class="amt" style="color:var(--${o.type === 'in' ? 'income' : 'expense'})">${money(o.type === 'in' ? o.amount : -o.amount)}</span>
        <button class="del" data-i="${i}" aria-label="Удалить">×</button></li>`).join('')
      : '<li class="empty">Операций нет</li>';
    document.getElementById('mStart').textContent = money(x.start, false);
    const e = document.getElementById('mEnd');
    e.textContent = money(x.end, false);
    e.className = x.end < 0 ? 'neg' : '';
  }
  const closeModal = () => { backdrop.classList.remove('open'); openDay = null; };
  const dayKey = () => key(view.y, view.m, openDay);
  const editableOps = () => store.days[dayKey()] || (store.days[dayKey()] = opsFor(view.y, view.m, openDay).map(o => ({ ...o })));

  document.getElementById('mOps').addEventListener('click', e => {
    const b = e.target.closest('.del'); if (!b) return;
    editableOps().splice(+b.dataset.i, 1);
    save(dayKey().slice(0, 7)); render(); renderModal();
  });
  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const amount = Math.round(parseFloat(f.get('amount')) * 100) / 100;
    if (!(amount > 0)) return;
    const type = f.get('type');
    const op = { type, title: String(f.get('title') || '').trim(), amount };
    if (type === 'out') op.cat = selCat; else op.bank = selBank;
    editableOps().push(op);
    save(dayKey().slice(0, 7)); render(); renderModal();
    e.target.title.value = ''; e.target.amount.value = ''; e.target.amount.focus();
  });

  // ---------- Category / bank pickers ----------
  let selCat = 'food', selBank = 'kaspi';
  const chip = (c, on, cls = '') => `<button type="button" class="chip ${cls}" role="radio" aria-checked="${on}" data-id="${c.id}" style="--tag:var(--c-${c.id})">${c.name}</button>`;
  function renderPickers() {
    const type = document.querySelector('#addForm input[name="type"]:checked').value;
    const pc = document.getElementById('pickCat'), pb = document.getElementById('pickBank');
    pc.hidden = type !== 'out'; pb.hidden = type !== 'in';
    document.getElementById('pickLabel').textContent = type === 'out' ? 'На что потрачено' : 'Куда пришли деньги';
    pc.innerHTML = CATS.map(c => chip(c, c.id === selCat)).join('');
    pb.innerHTML = BANKS.map(b => chip(b, b.id === selBank, 'bank')).join('');
  }
  document.getElementById('addForm').addEventListener('change', e => { if (e.target.name === 'type') renderPickers(); });
  document.getElementById('pickCat').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return; selCat = b.dataset.id; renderPickers(); document.getElementById('fAmount').focus();
  });
  document.getElementById('pickBank').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return; selBank = b.dataset.id; renderPickers(); document.getElementById('fAmount').focus();
  });
  document.getElementById('resetDay').addEventListener('click', () => {
    delete store.days[dayKey()]; save(dayKey().slice(0, 7)); render(); renderModal();
  });
  document.getElementById('closeModal').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && openDay) closeModal(); });

  grid.addEventListener('click', e => { const c = e.target.closest('.day[data-d]'); if (c) openModal(+c.dataset.d); });
  grid.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.day[data-d]')) { e.preventDefault(); openModal(+e.target.dataset.d); }
  });

  // ---------- Navigation & settings ----------
  const shift = n => { const d = new Date(view.y, view.m + n, 1); view = { y: d.getFullYear(), m: d.getMonth() }; render(); };
  document.getElementById('prev').addEventListener('click', () => shift(-1));
  document.getElementById('next').addEventListener('click', () => shift(1));
  document.getElementById('todayBtn').addEventListener('click', () => { view = { y: today.getFullYear(), m: today.getMonth() }; render(); });
  document.getElementById('opening').addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    const mk = key(view.y, view.m, 1).slice(0, 7);
    if (e.target.value.trim() === '') delete store.opening[mk];
    else store.opening[mk] = isFinite(v) ? v : 0;
    save(mk); render();
  });

  render();
  connectCloud();
})();
</script>
</body>
</html>
